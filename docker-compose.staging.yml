# 開発用の docker-compose.yml とプロジェクト名を分ける（同じだと、コンテナとイメージ（trail-condition-portal-web）を取り合う）
name: trail-condition-portal-staging

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: batch
    # batch のイメージは app ユーザーで動き /code に書けないため、collectstatic を流すこのコンテナは root で動かす（ローカルで試す用）
    user: root
    working_dir: /code
    command: >
      sh -c "uv run manage.py migrate &&
             uv run manage.py collectstatic --noinput &&
             uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    # 開発用の docker-compose.yml と同時に動かすときは、ポートを変える（例：PORT=8001 docker compose -f docker-compose.staging.yml up）
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - UV_COMPILE_BYTECODE=1
    env_file:
      - .env.staging
    restart: unless-stopped