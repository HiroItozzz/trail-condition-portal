steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "build-server"
    waitFor: ["-"]
    # BuildKit で、指定したターゲットに必要なステージだけをビルドする
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - "build"
      - "--cache-from"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/trail-info/$_BRANCH_NAME:latest"
      - "--target=server"
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/trail-info/$_BRANCH_NAME:$TAG_NAME"
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/trail-info/$_BRANCH_NAME:latest"
      - "-f"
      - "Dockerfile.prod"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "build-batch"
    waitFor: ["-"]
    # BuildKit で、指定したターゲットに必要なステージだけをビルドする
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - "build"
      - "--cache-from"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/trail-info/$_BRANCH_NAME-batch:latest"
      - "--target=batch"
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/trail-info/$_BRANCH_NAME-batch:$TAG_NAME"
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/trail-info/$_BRANCH_NAME-batch:latest"
      - "-f"
      - "Dockerfile.prod"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "push-server"
    waitFor: ["build-server"]
    args:
      - "push"
      - "--all-tags"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/trail-info/$_BRANCH_NAME"

  - name: "gcr.io/cloud-builders/docker"
    id: "push-batch"
    waitFor: ["build-batch"]
    args:
      - "push"
      - "--all-tags"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/trail-info/$_BRANCH_NAME-batch"

  - name: "asia.gcr.io/google.com/cloudsdktool/google-cloud-cli:stable"
    id: "deploy-migrate-job"
    waitFor: ["push-server"]
    entrypoint: "gcloud"
    args:
      - "run"
      - "jobs"
      - "deploy"
      - "trail-info-$_BRANCH_NAME-migrate"
      - "--image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/trail-info/$_BRANCH_NAME:$TAG_NAME"
      - "--region=asia-northeast1"
      - "--task-timeout=1200s"
      - "--set-secrets=DJANGO_SECRET_KEY=$_DJANGO_SECRET_KEY:latest,DATABASE_URL=$_DATABASE_URL:latest"
      - "--command=uv"
      - "--args=run,--frozen,--no-dev,manage.py,migrate"

  - name: "asia.gcr.io/google.com/cloudsdktool/google-cloud-cli:stable"
    id: "execute-migrate"
    waitFor: ["deploy-migrate-job"]
    entrypoint: "gcloud"
    args:
      - "run"
      - "jobs"
      - "execute"
      - "trail-info-$_BRANCH_NAME-migrate"
      - "--region=asia-northeast1"
      - "--wait"
      - "--task-timeout=20m"

  - name: "asia.gcr.io/google.com/cloudsdktool/google-cloud-cli:stable"
    id: "deploy-sync-job"
    # マイグレーションのあとに更新する（新しいコードが古いスキーマで動かないように）
    waitFor: ["push-batch", "execute-migrate"]
    entrypoint: "gcloud"
    args:
      - "run"
      - "jobs"
      - "deploy"
      - "trail-info-$_BRANCH_NAME-run-sync"
      - "--image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/trail-info/$_BRANCH_NAME-batch:$TAG_NAME"
      - "--region=asia-northeast1"
      - "--set-secrets=DJANGO_SECRET_KEY=$_DJANGO_SECRET_KEY:latest,DATABASE_URL=$_DATABASE_URL:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,LANGSMITH_API_KEY=LANGSMITH_API_KEY:latest,SLACK_WEBHOOK_URL=SLACK_WEBHOOK_URL:latest,EMAIL_PASSWORD_NOREPLY=EMAIL_PASSWORD_NOREPLY:latest"
      - "--command=uv"
      - "--args=run,--frozen,--no-dev,manage.py,trail_sync"

  - name: "asia.gcr.io/google.com/cloudsdktool/google-cloud-cli:stable"
    id: "deploy-blog-sync-job"
    # マイグレーションのあとに更新する（新しいコードが古いスキーマで動かないように）
    waitFor: ["push-batch", "execute-migrate"]
    entrypoint: "gcloud"
    args:
      - "run"
      - "jobs"
      - "deploy"
      - "trail-info-$_BRANCH_NAME-run-blog-sync"
      - "--image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/trail-info/$_BRANCH_NAME-batch:$TAG_NAME"
      - "--region=asia-northeast1"
      - "--set-secrets=DJANGO_SECRET_KEY=$_DJANGO_SECRET_KEY:latest,DATABASE_URL=$_DATABASE_URL:latest,SLACK_WEBHOOK_URL=SLACK_WEBHOOK_URL:latest,EMAIL_PASSWORD_NOREPLY=EMAIL_PASSWORD_NOREPLY:latest"
      - "--command=uv"
      - "--args=run,--frozen,--no-dev,manage.py,blog_sync"

  - name: "asia.gcr.io/google.com/cloudsdktool/google-cloud-cli:stable"
    id: "deploy-service"
    waitFor: ["execute-migrate"]
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/trail-info/$_BRANCH_NAME:$TAG_NAME"
      - "--region=asia-northeast1"
      - "--set-secrets=DJANGO_SECRET_KEY=$_DJANGO_SECRET_KEY:latest,DATABASE_URL=$_DATABASE_URL:latest"

  - name: "curlimages/curl:8.22.0"
    id: "check-service"
    # デプロイ後、トップページが 200 を返すかを確かめる。失敗してもビルドが失敗になるだけで、
    # トラフィックは新しいリビジョンのまま。応答がなくても 1 分以内に終わるよう、再試行は 2 回まで。
    # gcloud のイメージには curl が入っていないため、curl の公式イメージを使う。
    # 出力先は /dev/null にしない（再試行の前に出力先を空にできず、5xx で再試行されないため）
    # 本番は Cloudflare を通るため、キャッシュから返った 200 で成功しないよう、デプロイごとに違うクエリをつける。
    # cf-cache-status（Cloudflare のキャッシュの状態）もログに出す
    waitFor: ["deploy-service"]
    entrypoint: "sh"
    args:
      - "-c"
      - |
        out=$$(curl -sS -o "$$(mktemp)" -w "%{http_code} %header{cf-cache-status}" --retry 2 --retry-delay 3 --retry-all-errors --connect-timeout 5 --max-time 15 "https://trail-info.jp/?deploy_check=$TAG_NAME")
        rc=$$?
        code=$${out%% *}
        echo "https://trail-info.jp/?deploy_check=$TAG_NAME -> $$code (curl exit $$rc, cf-cache-status: $${out#* })"
        test "$$code" = "200"

images:
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/trail-info/$_BRANCH_NAME:$TAG_NAME"
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/trail-info/$_BRANCH_NAME:latest"

options:
  logging: CLOUD_LOGGING_ONLY
